<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To Do List</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>
                <iconify-icon icon="mdi:checkbox-marked-circle-outline"></iconify-icon>
                To Do List
            </h1>
        </header>

        <div class="form-card">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <label>Task Name</label>
                <input type="text" id="taskName"
                    placeholder="Enter task name" required>

                <label>Task Description</label>
                <textarea id="taskDescription"
                    placeholder="Enter task description"></textarea>

                <button type="submit">
                    <iconify-icon icon="mdi:plus"></iconify-icon>
                    <span id="submitText">Add Task</span>
                </button>

                <button type="button" id="cancelEdit"
                    class="cancel-button hidden">
                    Cancel
                </button>

            </form>

        </div>

        <div class="filters">

            <button class="active" data-filter="all">
                All Tasks
            </button>

            <button data-filter="completed">
                Completed
            </button>

            <button data-filter="waiting">
                Waiting
            </button>

        </div>

        <div class="tasks-card">

            <h2>My Tasks</h2>

            <span id="taskCount">0 tasks</span>

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Status</th>
                        <th>Task Name</th>
                        <th>Description</th>
                        <th>Editing</th>
                    </tr>
                </thead>

                <tbody id="taskList">

                    <tr>
                        <td colspan="5">No Tasks Found</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <script src="app.js"></script>
    <script src="todo.js"></script>

</body>
</html>
